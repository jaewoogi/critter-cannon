</style><style>.aiLevel{margin-top:10px;padding:10px;border:1px solid #ffffff35;border-radius:12px;background:#0b172488}.levelTitle{font-size:12px;font-weight:900;color:#a9c1d1;margin-bottom:7px}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.levels button{border:1px solid #ffffff55;background:#16283b;padding:8px 5px;border-radius:9px;font-weight:900}.levels button small{display:block;font-size:9px;color:#9fb0bc;margin-top:2px}.levels button.active{border-color:#ffe17d;background:#514222;color:#ffe99b}.levels button.active small{color:#ffe6a1}@media(max-width:700px){.aiLevel{margin-top:7px;padding:7px}.levelTitle{margin-bottom:5px}.levels button{padding:6px 3px;font-size:11px}}</style></head><body><main id="app"><section id="shell"><canvas id="game" width="1200" height="700"></canvas><div id="hud" class="hidden"><div class="player"><div class="avatar">🦊</div><div><div class="name" id="n0">여우 대장</div><div class="hp"><i id="hp0"></i></div></div></div><div class="center"><div class="wind" id="wind">바람　→ 0.0</div><div class="turn" id="turn">TURN 1 · 여우 대장</div></div><div class="player right"><div class="avatar">🐼</div><div><div class="name" id="n1">판다 박사</div><div class="hp"><i id="hp1"></i></div></div></div></div><div id="toast">직격!</div><button id="pause" class="hidden">Ⅱ</button><div id="powerWrap" class="hidden"><div class="powerLabel">POWER <span id="powerNum">0</span></div><div class="power"><i id="powerFill"></i></div></div><div id="controls" class="hidden"><div class="pad"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button><button class="ctrl" id="down">각−</button><button class="ctrl" id="up">각＋</button></div><div class="actions"><button class="ctrl" id="item">더블<br>SHOT</button><button class="ctrl" id="fire">꾹 눌러<br>FIRE</button></div></div>
<section id="overlay"><div class="card"><div class="badge">WINDY HILLS ARTILLERY CLUB</div><h1 class="title">CRITTER CANNON<span>바람언덕 대작전</span></h1><p class="desc">바람을 읽고, 각도를 맞추고, 발사 버튼을 꾹 눌러 힘을 모으세요. 귀여운 전차들이 펼치는 정교한 턴제 포격전!</p><div class="mode"><button class="active" data-mode="ai">1인 · AI 대전</button><button data-mode="local">2인 · 한 기기</button></div><div id="aiLevel" class="aiLevel"><div class="levelTitle">AI 난이도</div><div class="levels"><button data-ai="easy">하<small>연습 상대</small></button><button class="active" data-ai="normal">중<small>균형 대전</small></button><button data-ai="hard">상<small>정밀 포격</small></button></div></div><button id="start" class="main">대결 시작</button><div class="help"><span class="desktopHint">PC: A/D 이동 · W/S 각도 · SPACE 길게 눌러 발사 · E 더블샷</span>스마트폰: 화면 아래 이동·각도 버튼 · FIRE 길게 눌러 파워 조절</div></div></section></section></main><script>
(()=>{'use strict';const c=document.querySelector('#game'),x=c.getContext('2d'),W=1200,H=700,TAU=Math.PI*2,$=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b=0)=>b+Math.random()*(a-b);let mode='ai',aiLevel='normal',state='menu',turn=0,round=1,wind=0,terrain=[],shots=[],parts=[],stars=[],clouds=[],keys={},charge=0,charging=false,waiting=0,doubleShot=[2,2],shake=0,toastT=0,last=0,audio;
const AI={easy:{aim:8,power:13,delay:1.65,item:.06},normal:{aim:2.5,power:5,delay:1.1,item:.22},hard:{aim:.7,power:1.7,delay:.72,item:.46}};
const tanks=[{name:'여우 대장',animal:'fox',color:'#ed703f',x:220,y:0,hp:100,angle:46,face:1},{name:'판다 박사',animal:'panda',color:'#efefdf',x:980,y:0,hp:100,angle:134,face:-1}];
function tone(f=300,d=.08,type='sine',vol=.04){try{audio||=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(35,f*.55),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(t+d)}catch(e){}}
function makeWorld(){terrain=[];for(let i=0;i<=W;i+=4){let y=480+70*Math.sin(i/175)+35*Math.sin(i/71)+18*Math.sin(i/33);if(i>480&&i<720)y+=60*Math.sin((i-480)/240*Math.PI);terrain.push(y)}for(let i=0;i<90;i++)stars.push({x:rand(W),y:rand(300),r:rand(2,.5)});clouds=Array.from({length:7},(_,i)=>({x:i*210+rand(100),y:70+rand(150),s:rand(1.2,.6)}));settleTanks()}
function ground(xp){const i=clamp(Math.round(xp/4),0,terrain.length-1);return terrain[i]}
function settleTanks(){for(const t of tanks)t.y=ground(t.x)-17}
function reset(){tanks[0].x=220;tanks[1].x=980;tanks.forEach((t,i)=>{t.hp=100;t.angle=i?134:46});turn=0;round=1;wind=rand(7,-7);doubleShot=[2,2];shots=[];parts=[];charge=0;waiting=0;makeWorld();updateHud()}
function start(){reset();state='aim';$('#overlay').classList.add('hidden');$('#hud').classList.remove('hidden');$('#controls').classList.remove('hidden');$('#powerWrap').classList.remove('hidden');$('#pause').classList.remove('hidden');announce('여우 대장 차례!')}
function updateHud(){for(let i=0;i<2;i++){$('#hp'+i).style.width=Math.max(0,tanks[i].hp)+'%';$('#n'+i).textContent=tanks[i].name+(doubleShot[i]?' · ×2 '+doubleShot[i]:'')}const dir=wind>0?'→':wind<0?'←':'·';$('#wind').textContent=`바람　${dir} ${Math.abs(wind).toFixed(1)}`;$('#turn').textContent=`TURN ${round} · ${tanks[turn].name}`;$('#powerFill').style.width=charge+'%';$('#powerNum').textContent=Math.round(charge)}
function announce(s){const e=$('#toast');e.textContent=s;e.classList.add('show');toastT=1.4}
function crater(cx,cy,r){for(let i=0;i<terrain.length;i++){const px=i*4,dx=Math.abs(px-cx);if(dx<r){const bowl=Math.sqrt(r*r-dx*dx)*.72;terrain[i]=Math.max(terrain[i],cy+bowl)}}settleTanks()}
function fire(power=charge,useDouble=false){if(state!=='aim'||shots.length)return;state='flight';charging=false;const t=tanks[turn],a=-t.angle*Math.PI/180,speed=240+power*5.8,vx=Math.cos(a)*speed,vy=Math.sin(a)*speed;shots.push({x:t.x+Math.cos(a)*40,y:t.y+Math.sin(a)*40,vx,vy,r:8,trail:[],owner:turn,life:0});if(useDouble&&doubleShot[turn]>0){doubleShot[turn]--;shots.push({x:t.x+Math.cos(a)*40,y:t.y+Math.sin(a)*40,vx:vx*.92,vy:vy*.92,r:7,trail:[],owner:turn,life:-.28})}charge=0;tone(150,.12,'square',.05);updateHud()}
function explode(s){const radius=68;crater(s.x,s.y,radius);for(const t of tanks){const d=Math.hypot(t.x-s.x,t.y-s.y),damage=Math.max(0,Math.round(52*(1-d/radius)));if(damage){t.hp-=damage;t.x=clamp(t.x+(t.x-s.x)*.15,30,W-30);announce(d<28?'완벽한 직격!':`${damage} DAMAGE!`)}}for(let i=0;i<52;i++){const a=rand(TAU),v=rand(330,50);parts.push({x:s.x,y:s.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:rand(10,3),life:rand(1.2,.35),c:i%3?'#ff9f43':'#fff4b0',smoke:i%5===0})}shake=22;tone(70,.45,'sawtooth',.12);settleTanks()}
function nextTurn(){if(tanks.some(t=>t.hp<=0)){state='over';const winner=tanks[tanks[0].hp>0?0:1];$('#overlay').classList.remove('hidden');$('.title').innerHTML=`${winner.animal==='fox'?'🦊':'🐼'} 승리!<span>${winner.name}의 완벽한 작전</span>`;$('.desc').textContent=`${round}턴 만에 대결이 끝났습니다. 지형과 바람을 다르게 만들어 다시 도전해 보세요.`;$('#start').textContent='다시 대결하기';return}turn=1-turn;round++;wind=clamp(wind+rand(4,-4),-10,10);state='aim';updateHud();announce(`${tanks[turn].name} 차례!`);if(mode==='ai'&&turn===1){state='ai';waiting=AI[aiLevel].delay}}
function aiFire(){const me=tanks[1],you=tanks[0],g=360,dx=you.x-me.x,best={err:1e9,a:135,p:60},d=AI[aiLevel];for(let a=100;a<174;a+=1)for(let p=25;p<=96;p+=2){const sp=240+p*5.8,vx=Math.cos(-a*Math.PI/180)*sp,vy=Math.sin(-a*Math.PI/180)*sp,t=dx/vx;if(t>0){const py=me.y+vy*t+.5*g*t*t,err=Math.abs(py-you.y)+Math.abs(p-60)*.05;if(err<best.err)Object.assign(best,{err,a,p})}}me.angle=best.a+rand(d.aim,-d.aim);state='aim';charge=clamp(best.p+rand(d.power,-d.power),10,100);updateHud();fire(charge,Math.random()<d.item&&doubleShot[1]>0)}
function move(dir){if(state!=='aim'||(mode==='ai'&&turn===1))return;const t=tanks[turn],nx=clamp(t.x+dir*3,28,W-28);if(Math.abs(ground(nx)-ground(t.x))<18){t.x=nx;settleTanks()}}
function aim(dir){if(state!=='aim'||(mode==='ai'&&turn===1))return;const t=tanks[turn];t.angle=clamp(t.angle+dir*.65,turn?96:6,turn?174:84)}
function update(dt){clouds.forEach(o=>{o.x+=wind*dt*.7;if(o.x>W+120)o.x=-120;if(o.x<-120)o.x=W+120});if(toastT>0&&(toastT-=dt)<=0)$('#toast').classList.remove('show');shake=Math.max(0,shake-dt*36);if(state==='aim'){if(keys.KeyA||keys.ArrowLeft)move(-1);if(keys.KeyD||keys.ArrowRight)move(1);if(keys.KeyW||keys.ArrowUp)aim(1);if(keys.KeyS||keys.ArrowDown)aim(-1);if(charging){charge+=dt*58;if(charge>=100)charge=12;updateHud()}}if(state==='ai'){waiting-=dt;if(waiting<=0)aiFire()}
 for(const s of shots){s.life+=dt;if(s.life<0)continue;s.trail.push({x:s.x,y:s.y,l:1});if(s.trail.length>28)s.trail.shift();s.vx+=wind*7.5*dt;s.vy+=360*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;for(const q of s.trail)q.l-=dt*1.6;if((s.x>=0&&s.x<=W&&s.y>=ground(s.x))||s.y>H+80){s.dead=true;explode(s)}else if(s.x<-100||s.x>W+100){s.dead=true;announce('바람 너머로 날아갔어요!')}}if(shots.some(s=>s.dead)){shots=shots.filter(s=>!s.dead);if(!shots.length){waiting=.9;state='settle'}}if(state==='settle'&&(waiting-=dt)<=0)nextTurn();for(const p of parts){p.life-=dt;p.vy+=180*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;if(p.smoke)p.r+=dt*14}parts=parts.filter(p=>p.life>0)}
function sky(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#77ccef');g.addColorStop(.63,'#d8f5ef');g.addColorStop(1,'#ffc97d');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#ffe98c';x.shadowColor='#ffe493';x.shadowBlur=35;x.beginPath();x.arc(995,105,44,0,TAU);x.fill();x.shadowBlur=0;for(const s of stars){x.globalAlpha=.18;x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,TAU);x.fill()}x.globalAlpha=1;for(const o of clouds){x.save();x.translate(o.x,o.y);x.scale(o.s,o.s);x.fillStyle='#fffdf4c9';for(const [cx,cy,r]of[[-45,8,34],[0,0,48],[46,11,31],[10,20,52]]){x.beginPath();x.arc(cx,cy,r,0,TAU);x.fill()}x.restore()}x.globalAlpha=.15;x.fillStyle='#435f75';for(let i=0;i<6;i++){x.beginPath();x.moveTo(i*250-130,H*.65);x.lineTo(i*250+80,H*.28);x.lineTo(i*250+280,H*.65);x.fill()}x.globalAlpha=1}
function land(){x.beginPath();x.moveTo(0,H);x.lineTo(0,terrain[0]);for(let i=0;i<terrain.length;i++)x.lineTo(i*4,terrain[i]);x.lineTo(W,H);x.closePath();const g=x.createLinearGradient(0,360,0,H);g.addColorStop(0,'#63a94f');g.addColorStop(.08,'#397846');g.addColorStop(.1,'#8d6a43');g.addColorStop(1,'#362d2e');x.fillStyle=g;x.fill();x.strokeStyle='#a2d66e';x.lineWidth=5;x.stroke();for(let i=20;i<W;i+=75){const y=ground(i);x.fillStyle='#29593b';x.beginPath();x.arc(i,y-6,rand(11,5),Math.PI,TAU);x.fill()} }
function tank(t,i){x.save();x.translate(t.x,t.y);if(t.hp<=0)x.globalAlpha=.45;x.fillStyle='#0003';x.beginPath();x.ellipse(0,18,42,10,0,0,TAU);x.fill();x.fillStyle=i?'#375d5b':'#355b7a';rounded(-35,-8,70,25,10);x.fillStyle='#1c3448';for(const sx of[-22,0,22]){x.beginPath();x.arc(sx,11,9,0,TAU);x.fill();x.strokeStyle='#7091a1';x.lineWidth=3;x.stroke()}x.save();x.rotate(-t.angle*Math.PI/180);x.fillStyle='#30475b';rounded(0,-6,52,12,6);x.fillStyle='#e8b946';x.fillRect(40,-4,15,8);x.restore();x.fillStyle=t.color;x.beginPath();x.arc(0,-18,27,0,TAU);x.fill();if(i===0){x.beginPath();x.moveTo(-22,-34);x.lineTo(-18,-57);x.lineTo(-5,-40);x.moveTo(22,-34);x.lineTo(18,-57);x.lineTo(5,-40);x.fill();x.fillStyle='#fff';x.beginPath();x.ellipse(0,-10,16,11,0,0,TAU);x.fill()}else{x.fillStyle='#242329';x.beginPath();x.arc(-19,-34,12,0,TAU);x.arc(19,-34,12,0,TAU);x.fill();x.fillStyle='#fff';x.beginPath();x.ellipse(0,-15,22,18,0,0,TAU);x.fill();x.fillStyle='#202228';x.beginPath();x.ellipse(-9,-19,7,9,-.3,0,TAU);x.ellipse(9,-19,7,9,.3,0,TAU);x.fill()}x.fillStyle='#15212a';x.beginPath();x.arc(-8,-18,2.8,0,TAU);x.arc(8,-18,2.8,0,TAU);x.fill();x.strokeStyle='#15212a';x.lineWidth=2;x.beginPath();x.arc(0,-9,6,.2,Math.PI-.2);x.stroke();x.restore();if(state==='aim'&&turn===i){const a=-t.angle*Math.PI/180;x.setLineDash([7,8]);x.strokeStyle='#fff9';x.lineWidth=2;x.beginPath();x.moveTo(t.x,t.y);for(let k=1;k<13;k++){const tt=k*.11,sp=450;x.lineTo(t.x+Math.cos(a)*sp*tt+.5*wind*7.5*tt*tt,t.y+Math.sin(a)*sp*tt+.5*360*tt*tt)}x.stroke();x.setLineDash([]);x.fillStyle='#fff';x.font='900 14px system-ui';x.textAlign='center';x.fillText(`${Math.round(t.angle)}°`,t.x,t.y-72)}}
function rounded(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function projectile(s){for(let i=0;i<s.trail.length;i++){const q=s.trail[i];x.globalAlpha=(i/s.trail.length)*.55;x.fillStyle='#fff';x.beginPath();x.arc(q.x,q.y,2+i/10,0,TAU);x.fill()}x.globalAlpha=1;x.fillStyle='#303b45';x.shadowColor='#ffd552';x.shadowBlur=14;x.beginPath();x.arc(s.x,s.y,s.r,0,TAU);x.fill();x.fillStyle='#ffdb60';x.beginPath();x.arc(s.x-s.vx*.015,s.y-s.vy*.015,5,0,TAU);x.fill();x.shadowBlur=0}
function draw(){x.save();if(shake)x.translate(rand(shake,-shake),rand(shake,-shake));sky();land();tanks.forEach(tank);shots.forEach(projectile);for(const p of parts){x.globalAlpha=Math.min(1,p.life*2);x.fillStyle=p.smoke?'#4b5260':p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,TAU);x.fill()}x.globalAlpha=1;x.restore()}
function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}
document.querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-ai]').forEach(z=>z.classList.remove('active'));b.classList.add('active');aiLevel=b.dataset.ai});document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{document.querySelector('#aiLevel').classList.toggle('hidden',b.dataset.mode==='local')}));
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(z=>z.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;tanks[1].name=mode==='ai'?'판다 박사':'판다 친구'});$('#start').onclick=start;document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.code==='Space'&&!e.repeat&&state==='aim'){charging=true;charge=8}if(e.code==='KeyE'&&!e.repeat&&state==='aim')fire(70,true)});document.addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Space'&&charging)fire(charge,false)});
for(const [id,fn]of[['left',()=>move(-1)],['right',()=>move(1)],['up',()=>aim(1)],['down',()=>aim(-1)]]){const el=$('#'+id);let timer;const go=e=>{e.preventDefault();el.classList.add('down');fn();timer=setInterval(fn,28)},stop=()=>{clearInterval(timer);el.classList.remove('down')};el.addEventListener('pointerdown',go);el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop);el.addEventListener('pointerleave',stop)}const fb=$('#fire');fb.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='aim'){charging=true;charge=8;fb.classList.add('down')}});const stopFire=e=>{e.preventDefault();if(charging)fire(charge,false);fb.classList.remove('down')};fb.addEventListener('pointerup',stopFire);fb.addEventListener('pointercancel',stopFire);$('#item').onclick=()=>{if(state==='aim'&&doubleShot[turn]>0)fire(72,true)};$('#pause').onclick=()=>{if(state==='paused'){state='aim';announce('계속!')}else if(state==='aim'){state='paused';announce('일시정지')}};window.addEventListener('blur',()=>{if(state==='aim')state='paused'});window.__CRITTER__={tanks,AI,get aiLevel(){return aiLevel},get state(){return state},reset,fire,crater,ground};makeWorld();draw();requestAnimationFrame(loop)})();
</script></body></html>
